{% extends 'beauty/base.html' %}

{% block title %}Criar conta | MPBeauty{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <h1>Criar sua conta</h1>

        <p class="auth-description">
            Faça seu cadastro para aproveitar o MPBeauty!
        </p>

        <form method="post" class="auth-form">

            {% csrf_token %}

            {{ formulario.as_p }}

            <button type="submit">
                Cadastrar
            </button>

        </form>

        <p class="auth-footer">
            Já possui uma conta?
            <a href="{% url 'login' %}">Entrar</a>
        </p>

    </div>

</section>

{% endblock %}
